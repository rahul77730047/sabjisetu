name: sabzisetu_flutter
description: Flutter/Dart frontend converted from SabziSetu React web app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_staggered_animations: ^1.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#064E3B"
  adaptive_icon_foreground: "assets/app icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#002B0F"
  fullscreen: true
  android: true
  ios: true
  image: "assets/Splash screen.png"

  android_12:
    color: "#002B0F"
    image: "assets/Splash screen.png"

flutter:
  uses-material-design: true

  assets:
    - assets/